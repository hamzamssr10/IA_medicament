<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Live Camera Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap');

  :root {
    --bg:        #0a0c10;
    --surface:   #10141c;
    --border:    #1e2736;
    --accent:    #00e5ff;
    --accent2:   #ff3d71;
    --text:      #c8d6e5;
    --dim:       #4a5568;
    --green:     #00ff88;
    --radius:    6px;
    --mono:      'Share Tech Mono', monospace;
    --sans:      'Barlow', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ── scanline overlay ─── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.12) 2px,
      rgba(0,0,0,.12) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ── Header ──────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    display: flex; align-items: center; gap: 12px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    animation: pulse 3s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: .6; }
  }
  .logo h1 {
    font-family: var(--mono);
    font-size: 1rem;
    letter-spacing: .15em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .logo span {
    display: block;
    font-size: .65rem;
    color: var(--dim);
    letter-spacing: .08em;
    margin-top: 1px;
  }

  .status-bar {
    display: flex; gap: 18px; align-items: center;
  }
  .status-item {
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--dim);
    display: flex; align-items: center; gap: 6px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--dim);
    transition: background .4s;
  }
  .dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.err  { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }

  #clock {
    font-family: var(--mono);
    font-size: .8rem;
    color: var(--text);
    letter-spacing: .06em;
  }

  /* ── Main grid ───────────────────────────────────────────────── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    height: calc(100vh - 65px);
  }

  .cam-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    transition: border-color .3s;
  }
  .cam-cell:hover { border-color: var(--accent); }
  .cam-cell.active { border-color: var(--green); }
  .cam-cell.error  { border-color: var(--accent2); }

  /* corner notch */
  .cam-cell::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 18px 18px 0 0;
    border-color: var(--accent) transparent transparent transparent;
    opacity: .7;
    z-index: 2;
  }

  .cam-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: rgba(0,0,0,.35);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .cam-label {
    font-family: var(--mono);
    font-size: .75rem;
    letter-spacing: .12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .cam-meta {
    display: flex; gap: 10px; align-items: center;
  }
  .cam-badge {
    font-family: var(--mono);
    font-size: .65rem;
    padding: 2px 8px;
    border-radius: 2px;
    background: rgba(0,229,255,.1);
    border: 1px solid rgba(0,229,255,.25);
    color: var(--accent);
    letter-spacing: .06em;
  }
  .cam-state {
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--dim);
  }

  .video-wrap {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* placeholder while connecting */
  .placeholder {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--surface);
    z-index: 5;
    transition: opacity .5s;
  }
  .placeholder.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 40px; height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .placeholder p {
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--dim);
    letter-spacing: .1em;
  }

  /* HUD overlay on active feed */
  .hud {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    transition: opacity .4s;
  }
  .cam-cell.active .hud { opacity: 1; }

  .hud-corner {
    position: absolute;
    width: 18px; height: 18px;
    border-color: var(--accent);
    border-style: solid;
    opacity: .6;
  }
  .hud-corner.tl { top: 6px; left: 6px;  border-width: 2px 0 0 2px; }
  .hud-corner.tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
  .hud-corner.bl { bottom: 6px; left: 6px;  border-width: 0 0 2px 2px; }
  .hud-corner.br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

  .hud-rec {
    position: absolute;
    top: 8px; right: 8px;
    display: flex; align-items: center; gap: 5px;
    font-family: var(--mono);
    font-size: .65rem;
    color: var(--accent2);
    letter-spacing: .08em;
  }
  .hud-rec::before {
    content: '';
    width: 7px; height: 7px;
    background: var(--accent2);
    border-radius: 50%;
    animation: pulse 1s ease-in-out infinite;
  }

  .cam-footer {
    padding: 6px 14px;
    background: rgba(0,0,0,.4);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .cam-stats {
    font-family: var(--mono);
    font-size: .65rem;
    color: var(--dim);
    display: flex; gap: 14px;
  }

  .btn-connect {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 4px 14px;
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(0,229,255,.4);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .btn-connect:hover { background: rgba(0,229,255,.08); border-color: var(--accent); }
  .btn-connect:disabled { opacity: .35; cursor: not-allowed; }

  /* ── Error state ─────────────────────────────────────────────── */
  .err-overlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(10,12,16,.85);
    z-index: 6;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .err-overlay.show { display: flex; }
  .err-icon {
    font-size: 2rem;
    color: var(--accent2);
  }
  .err-msg {
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--accent2);
    letter-spacing: .08em;
    text-align: center;
    padding: 0 20px;
  }
  .btn-retry {
    font-family: var(--mono);
    font-size: .7rem;
    padding: 5px 16px;
    background: rgba(255,61,113,.1);
    color: var(--accent2);
    border: 1px solid rgba(255,61,113,.5);
    border-radius: var(--radius);
    cursor: pointer;
    letter-spacing: .08em;
    text-transform: uppercase;
    transition: background .2s;
  }
  .btn-retry:hover { background: rgba(255,61,113,.2); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    <div>
      <h1>SENTINEL ● CAM</h1>
      <span>4-channel live monitor</span>
    </div>
  </div>
  <div class="status-bar">
    <div class="status-item"><span class="dot" id="dot-0"></span>CAM 0</div>
    <div class="status-item"><span class="dot" id="dot-1"></span>CAM 1</div>
    <div class="status-item"><span class="dot" id="dot-2"></span>CAM 2</div>
    <div class="status-item"><span class="dot" id="dot-3"></span>CAM 3</div>
    <span id="clock">--:--:--</span>
  </div>
</header>

<main id="grid"></main>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const SERVER = window.location.origin;   // same host
const CAMS   = [0, 1, 2, 3];

// ── Build grid ────────────────────────────────────────────────────────────
const grid = document.getElementById("grid");

CAMS.forEach(id => {
  grid.insertAdjacentHTML("beforeend", `
    <div class="cam-cell" id="cell-${id}">
      <div class="cam-header">
        <span class="cam-label">⬡ Channel ${id.toString().padStart(2,"0")}</span>
        <div class="cam-meta">
          <span class="cam-badge">WebRTC</span>
          <span class="cam-state" id="state-${id}">IDLE</span>
        </div>
      </div>

      <div class="video-wrap">
        <video id="video-${id}" autoplay playsinline muted></video>
        <div class="placeholder" id="ph-${id}">
          <div class="spinner"></div>
          <p>AWAITING SIGNAL…</p>
        </div>
        <div class="hud">
          <div class="hud-corner tl"></div><div class="hud-corner tr"></div>
          <div class="hud-corner bl"></div><div class="hud-corner br"></div>
          <div class="hud-rec">REC</div>
        </div>
        <div class="err-overlay" id="err-${id}">
          <div class="err-icon">⚠</div>
          <div class="err-msg" id="errmsg-${id}">Connection lost</div>
          <button class="btn-retry" onclick="connect(${id})">RETRY</button>
        </div>
      </div>

      <div class="cam-footer">
        <div class="cam-stats">
          <span id="fps-${id}">— fps</span>
          <span id="res-${id}">—×—</span>
          <span id="lat-${id}">— ms</span>
        </div>
        <button class="btn-connect" id="btn-${id}" onclick="connect(${id})">
          CONNECT
        </button>
      </div>
    </div>
  `);
});

// ── State ─────────────────────────────────────────────────────────────────
const pcs  = {};    // RTCPeerConnection per cam
const fps  = {};    // frame counters

// ── Clock ─────────────────────────────────────────────────────────────────
setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("en-GB");
}, 1000);

// ── Helpers ───────────────────────────────────────────────────────────────
function setState(id, s) {
  document.getElementById(`state-${id}`).textContent = s;
}
function setDot(id, cls) {
  const d = document.getElementById(`dot-${id}`);
  d.className = "dot " + cls;
}
function showErr(id, msg) {
  document.getElementById(`errmsg-${id}`).textContent = msg;
  document.getElementById(`err-${id}`).classList.add("show");
  document.getElementById(`cell-${id}`).className = "cam-cell error";
  setDot(id, "err");
  setState(id, "ERROR");
}
function clearErr(id) {
  document.getElementById(`err-${id}`).classList.remove("show");
}

// ── Per-camera FPS tracker ────────────────────────────────────────────────
function trackFPS(id, video) {
  let fc = 0, last = performance.now();
  fps[id] = setInterval(() => {
    const now  = performance.now();
    const rate = (fc / ((now - last) / 1000)).toFixed(1);
    fc = 0; last = now;
    document.getElementById(`fps-${id}`).textContent = rate + " fps";
    if (video.videoWidth) {
      document.getElementById(`res-${id}`).textContent =
        `${video.videoWidth}×${video.videoHeight}`;
    }
  }, 1000);
  video.addEventListener("timeupdate", () => fc++);
}

// ── Connect one camera ────────────────────────────────────────────────────
async function connect(id) {
  // Clean up previous connection
  if (pcs[id]) {
    pcs[id].close();
    delete pcs[id];
  }
  clearErr(id);
  clearInterval(fps[id]);

  const btn   = document.getElementById(`btn-${id}`);
  const ph    = document.getElementById(`ph-${id}`);
  const video = document.getElementById(`video-${id}`);
  const cell  = document.getElementById(`cell-${id}`);

  btn.disabled  = true;
  btn.textContent = "CONNECTING…";
  cell.className = "cam-cell";
  setState(id, "SDP…");
  setDot(id, "");
  ph.classList.remove("hidden");
  video.srcObject = null;

  const t0 = performance.now();

  try {
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });
    pcs[id] = pc;

    // Receive track
    pc.ontrack = e => {
      video.srcObject = e.streams[0];
      video.play().catch(() => {});
      ph.classList.add("hidden");
      cell.className = "cam-cell active";
      setDot(id, "live");
      setState(id, "LIVE");
      btn.textContent  = "CONNECTED";
      const lat = (performance.now() - t0).toFixed(0);
      document.getElementById(`lat-${id}`).textContent = lat + " ms";
      trackFPS(id, video);
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
        showErr(id, "Peer connection " + pc.connectionState);
        btn.disabled   = false;
        btn.textContent = "RETRY";
      }
    };

    // Offer
    pc.addTransceiver("video", { direction: "recvonly" });
    const offer  = await pc.createOffer();
    await pc.setLocalDescription(offer);

    setState(id, "NEGOTIATING…");

    const resp = await fetch(`${SERVER}/offer`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ cam_id: id, sdp: offer.sdp, type: offer.type }),
    });

    if (!resp.ok) throw new Error(`Server error ${resp.status}`);

    const answer = await resp.json();
    await pc.setRemoteDescription(new RTCSessionDescription(answer));
    setState(id, "ICE…");

  } catch (err) {
    console.error("CAM", id, err);
    showErr(id, err.message || "Connection failed");
    btn.disabled   = false;
    btn.textContent = "RETRY";
  }
}

// ── Auto-connect all cameras on load ─────────────────────────────────────
window.addEventListener("load", () => {
  CAMS.forEach((id, i) => setTimeout(() => connect(id), i * 300));
});
</script>
</body>
</html>
